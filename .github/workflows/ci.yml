name: CI

on:
  pull_request:
    branches: [stage, prod]
  push:
    branches: [stage, prod]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Messages are compiled into src/paraglide, which is not committed.
      - run: npm run i18n

      - run: npm run lint -- src

      - run: npx tsc --noEmit

      - run: npm test

      - run: npm run build
        env:
          VITE_BASE_URL: https://example.com
